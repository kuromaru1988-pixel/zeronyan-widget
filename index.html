<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ぜろにゃん お散歩ウィジェット</title>
<style>
  /* ===== ベース：余白なし・はみ出し非表示・背景透明 ===== */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
  }

  /* ステージ（画面全体）。気分演出の明るさ切り替えはここに当てる */
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    transition: filter 1.2s ease;
  }

  /* ぜろにゃん本体。位置はleft、見た目はtransformで制御 */
  #zeronyan {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 78vh;          /* JSで画面比に応じて再計算 */
    will-change: transform, left;
    transform-origin: 50% 100%; /* 足元基準で跳ね・傾き */
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
  }

  /* ===== 吹き出し（ふきだし） ===== */
  #bubble {
    position: absolute;
    max-width: 240px;
    box-sizing: border-box;
    padding: 10px 14px;
    background: #ffffff;
    color: #333;
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
    font-size: 15px;
    line-height: 1.5;
    font-weight: 600;
    border-radius: 18px;
    border: 2px solid #ffd24a;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    word-break: break-word;       /* 日本語をきれいに折り返す */
    overflow-wrap: break-word;
    white-space: normal;
    text-align: left;
    opacity: 0;
    transform: translateY(6px) scale(0.96);
    transition: opacity .35s ease, transform .35s ease;
    pointer-events: none;
    z-index: 10;
  }
  #bubble.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  /* 吹き出しのしっぽ（下向き三角） */
  #bubble::after {
    content: "";
    position: absolute;
    left: 28px;
    bottom: -11px;
    border-width: 11px 9px 0 9px;
    border-style: solid;
    border-color: #ffffff transparent transparent transparent;
    filter: drop-shadow(0 2px 0 #ffd24a);
  }

  /* 居眠り時の💤マーク */
  #zzz {
    position: absolute;
    font-size: 22px;
    opacity: 0;
    pointer-events: none;
    z-index: 9;
  }
  #zzz.show { opacity: 1; animation: zzzFloat 2.4s ease-in-out infinite; }
  @keyframes zzzFloat {
    0%   { transform: translate(0, 0)    scale(0.9); opacity: .3; }
    50%  { transform: translate(8px, -18px) scale(1.1); opacity: 1; }
    100% { transform: translate(16px, -34px) scale(0.9); opacity: 0; }
  }
</style>
</head>

  var now = new Date();
  var day = now.getDay();      // 0=日, 6=土
  if (day === 0 || day === 6) return 'weekend';
  var h = now.getHours();
  if (h >= 5  && h <= 8)  return 'earlyMorning';
  if (h >= 9  && h <= 11) return 'morning';
  if (h === 12)           return 'lunch';
  if (h >= 13 && h <= 16) return 'afternoon';
  if (h === 17)           return 'beforeClose';
  if (h >= 18 && h <= 19) return 'overtimeEarly';
  if (h >= 20 && h <= 21) return 'overtime';
  return 'midnight';           // 22:00-翌4:59
}

/* --- 時刻 → 気分ゾーン（行動重み・明るさ用） --- */
function getMoodZone() {
  var h = new Date().getHours();
  if (h >= 22 || h <= 4) return 'night';     // 深夜
  if (h >= 18)           return 'evening';   // 夕〜夜
  return 'day';                              // 日中
}

/* --- サイズ計算（リサイズ対応・画面比でオートフィット） --- */
function resize() {
  catH = window.innerHeight * HEIGHT_RATIO;
  catW = catH * imgRatio;
  cat.style.height = catH + 'px';
  if (posX > window.innerWidth - catW) posX = Math.max(0, window.innerWidth - catW);
}
window.addEventListener('resize', resize);

/* --- 気分（明るさ）を反映 --- */
function applyMood() {
  stage.style.filter = 'brightness(' + MOOD[getMoodZone()].brightness + ')';
}

/* =========================================================================
   有限ステートマシン：行動パターン（6種）
   walk / idle / jump / dash / turn / doze
   ========================================================================= */
var state = 'idle';
var stateEndAt = 0;     // この時刻になったら次の行動へ
var animStart = 0;      // 現在状態の開始時刻

function rand(min, max){ return Math.random() * (max - min) + min; }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }

/* 重み付きで次の行動を選ぶ */
function chooseAction() {
  var w = ACTION_WEIGHTS[getMoodZone()];
  var total = 0, k;
  for (k in w) total += w[k];
  var r = Math.random() * total;
  for (k in w) {
    r -= w[k];
    if (r <= 0) return k;
  }
  return 'idle';
}

/* 次の行動へ遷移 */
function nextState(now) {
  state = chooseAction();
  animStart = now;
  var range = ACTION_DURATION[state] || [3000, 5000];
  stateEndAt = now + rand(range[0], range[1]);

  // 行動開始時の小芝居
  if (state === 'turn') {
    dir = -dir;                          // 振り向き
  } else if (state === 'walk' || state === 'dash') {
    if (Math.random() < 0.4) dir = -dir; // たまに向きを変えて歩き出す
  }
  toggleZzz(state === 'doze');           // doze中だけ💤
}

function toggleZzz(on) {
  if (on) zzz.classList.add('show');
  else    zzz.classList.remove('show');
}

/* =========================================================================
   メインループ（毎フレーム描画）
   ========================================================================= */
function loop(now) {
  if (!stateEndAt || now >= stateEndAt) nextState(now);

  var speedMul = MOOD[getMoodZone()].speedMul;
  var t = (now - animStart) / 1000;       // 状態開始からの経過秒
  var ty = 0, rot = 0, sx = dir;          // transform成分

  switch (state) {

    case 'walk':
      posX += WALK_SPEED * dir * speedMul;
      ty  = -Math.abs(Math.sin(t * 8)) * (catH * 0.025); // ぴょこ上下バウンド
      rot = Math.sin(t * 8) * 2.2;                        // 微傾き
      break;

    case 'dash':
      posX += DASH_SPEED * dir * speedMul;
      ty  = -Math.abs(Math.sin(t * 12)) * (catH * 0.05);  // 大きめバウンド
      rot = dir * 8;                                       // 前傾
      break;

    case 'idle':
      ty  = Math.sin(t * 2) * (catH * 0.008);             // 軽い呼吸（上下）
      rot = Math.sin(t * 0.8) * 1.0;                       // ときどき小さく揺れ
      break;

    case 'jump': {
      var jp = (t % 1.0);                                  // 1秒周期で1回ぴょん
      if (jp < 0.5) {
        ty = -Math.sin((jp / 0.5) * Math.PI) * (catH * 0.22); // 高めに跳ねる
      }
      break;
    }

    case 'turn':
      ty  = -Math.abs(Math.sin(t * 6)) * (catH * 0.02);   // 屈伸する小芝居
      rot = Math.sin(t * 6) * 3;
      break;

    case 'doze':
      rot = (Math.sin(t * 1.0) * 6) - 2;                  // ゆっくり傾いてコクッ
      ty  = Math.sin(t * 1.0) * (catH * 0.01);
      break;
  }

  // 端で折り返し（向きも反転）
  if (posX < 0)                        { posX = 0; dir = 1; }
  if (posX > window.innerWidth - catW) { posX = window.innerWidth - catW; dir = -1; }

  cat.style.left = posX + 'px';
  cat.style.transform =
    'translateY(' + ty + 'px) rotate(' + rot + 'deg) scaleX(' + sx + ')';

  // 💤マークをキャラの頭上あたりに追従
  zzz.style.left = (posX + catW * 0.62) + 'px';
  zzz.style.top  = (window.innerHeight - catH * 0.95) + 'px';

  requestAnimationFrame(loop);
}

/* =========================================================================
   吹き出し（時刻連動セリフ）
   ========================================================================= */
function showBubble() {
  bubble.textContent = pick(LINES[getTimeKey()]);

  // キャラの頭の近くに表示（画面内に収める）
  var bx = posX + catW * 0.45;
  var maxLeft = window.innerWidth - bubble.offsetWidth - 8;
  if (bx > maxLeft) bx = maxLeft;
  if (bx < 8) bx = 8;
  bubble.style.left = bx + 'px';
  bubble.style.top  = Math.max(8, window.innerHeight - catH * 1.02) + 'px';

  bubble.classList.add('show');
  setTimeout(function(){ bubble.classList.remove('show'); }, BUBBLE_SHOW_MS);

  // 次回の吹き出しをランダム間隔で予約（リアルタイムで時間帯を再判定）
  setTimeout(showBubble, rand(BUBBLE_MIN_MS, BUBBLE_MAX_MS));
}

/* =========================================================================
   起動
   ========================================================================= */
function start() {
  resize();
  applyMood();
  posX = window.innerWidth * 0.4;
  requestAnimationFrame(loop);
  setTimeout(showBubble, 1800);          // 最初の吹き出し
  setInterval(applyMood, 30000);         // 30秒ごとに気分（明るさ）を再判定
}

if (cat.complete) start();
else cat.addEventListener('load', start);
</script>
