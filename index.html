<title>ぜろにゃん お散歩ウィジェット</title>
<style>
  /* 背景は透明（Notionの背景になじむ） */
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    overflow: hidden;
    background: transparent;
  }
  /* キャラ本体。位置・反転・上下バウンド・傾きはJSとCSS変数で制御 */
  #zeronyan {
    position: absolute;
    bottom: 0;            /* 地面に立たせる */
    left: 0;
    /* --x:左右位置 --dir:向き(1/-1) --bounce:上下ぴょこ --tilt:傾き */
    transform:
      translateX(var(--x, 0px))
      translateY(var(--bounce, 0px))
      rotate(var(--tilt, 0deg))
      scaleX(var(--dir, 1));
    transform-origin: bottom center;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    will-change: transform;
  }
</style>

<script>
(function () {
  "use strict";
  var img = document.getElementById("zeronyan");

  // --- 状態 ---
  var x = 0;          // 現在の左右位置(px)
  var dir = 1;        // 進行方向 1=右 / -1=左
  var maxX = 0;       // 右端の限界
  var t = 0;          // 経過フレーム的な内部時間
  var SPEED = 0.55;   // 移動速度(px/frame換算)。ゆっくり観賞用

  // ウィンドウ高さの約75%にキャラをフィット
  function fit() {
    var targetH = window.innerHeight * 0.75;
    img.style.height = targetH + "px";
    img.style.width = "auto";
    // 画像描画後の実幅で右端を再計算
    var w = img.getBoundingClientRect().width || (targetH * 0.72);
    maxX = Math.max(0, window.innerWidth - w);
    if (x > maxX) x = maxX;  // リサイズで枠が縮んだ時のはみ出し防止
  }

  // 画像ロード完了後とリサイズ時にフィット
  if (img.complete) fit(); else img.addEventListener("load", fit);
  window.addEventListener("resize", fit);

  var last = performance.now();
  function loop(now) {
    var dt = Math.min(now - last, 50); // タブ復帰時の飛び対策
    last = now;
    var step = SPEED * (dt / 16.67);   // 60fps基準で速度を正規化
    t += dt / 16.67;

    // 左右移動
    x += step * dir;
    if (x >= maxX) { x = maxX; dir = -1; }   // 右端で反転
    else if (x <= 0) { x = 0; dir = 1; }      // 左端で反転

    // ぴょこぴょこ上下バウンド（歩行の足取り）
    var bounce = -Math.abs(Math.sin(t * 0.18)) * (window.innerHeight * 0.025);
    // わずかな傾き揺れ
    var tilt = Math.sin(t * 0.18) * 2.2;

    img.style.setProperty("--x", x + "px");
    img.style.setProperty("--dir", dir);      // 進行方向に顔を向ける(右=1/左=-1)
    img.style.setProperty("--bounce", bounce + "px");
    img.style.setProperty("--tilt", tilt + "deg");

    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);
})();
</script>
