<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ぜろにゃん お散歩ウィジェット v3.4</title>
<style>
  /* ===== ベース：余白なし・はみ出し非表示・背景透明 ===== */
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Meiryo", sans-serif;
  }

  /* ステージ（画面全体）。気分演出の明るさ切り替えはここに当てる */
  #stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
    transition: filter 1.2s ease;
  }

  /* ぜろにゃん本体。位置はleft、見た目はtransformで制御 */
  #zeronyan {
    position: absolute;
    left: 0;
    bottom: 0;
    height: 78vh;          /* JSで画面比に応じて再計算 */
    will-change: transform, left;
    transform-origin: 50% 100%; /* 足元基準で跳ね・傾き */
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: auto;   /* v3.2: なでなで（クリック）反応のため有効化 */
    cursor: pointer;
    z-index: 6;
  }

  /* なかま（追加キャラ）。ぜろにゃんと同じ流儀で動かす */
  .member {
    position: absolute;
    left: 0;
    bottom: 0;
    will-change: transform, left;
    transform-origin: 50% 100%;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: auto;   /* v3.2: なでなで（クリック）反応のため有効化 */
    cursor: pointer;
  }

  /* ===== 吹き出し（ふきだし）：全キャラ共通クラス ===== */
  .bubble {
    position: absolute;
    max-width: 240px;
    box-sizing: border-box;
    padding: 10px 14px;
    background: #ffffff;
    color: #333;
    font-size: 15px;
    line-height: 1.5;
    font-weight: 600;
    border-radius: 18px;
    border: 2px solid #ffd24a;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18);
    word-break: break-word;       /* 日本語をきれいに折り返す */
    overflow-wrap: break-word;
    white-space: normal;
    text-align: left;
    opacity: 0;
    transform: translateY(6px) scale(0.96);
    transition: opacity .35s ease, transform .35s ease;
    pointer-events: none;
    z-index: 10;
  }
  .bubble.show {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
  /* 吹き出しのしっぽ（下向き三角） */
  .bubble::after {
    content: "";
    position: absolute;
    left: 28px;
    bottom: -11px;
    border-width: 11px 9px 0 9px;
    border-style: solid;
    border-color: #ffffff transparent transparent transparent;
    filter: drop-shadow(0 2px 0 #ffd24a);
  }

  /* ===== v3.2: なでなで反応のハート／♪パーティクル ===== */
  .petHeart {
    position: absolute;
    font-size: 18px;
    opacity: 0;
    pointer-events: none;
    user-select: none;
    z-index: 12;
    animation: petFloat 1.3s ease-out forwards;
  }
  @keyframes petFloat {
    0%   { transform: translate(0, 0)      scale(0.6); opacity: 0; }
    20%  { transform: translate(2px, -10px) scale(1.05); opacity: 0.95; }
    100% { transform: translate(8px, -52px) scale(0.9); opacity: 0; }
  }

  /* ===== v3.2: 季節の背景演出（キャラより奥・控えめ） ===== */
  .sparticle {
    position: absolute;
    pointer-events: none;
    user-select: none;
    z-index: 1;             /* キャラ(z2〜6)より奥 */
    will-change: transform, opacity;
  }
  .sparticle.rainDrop {
    width: 1.5px;
    height: 14px;
    border-radius: 1px;
    background: rgba(120, 160, 220, 0.42);
  }

  /* ===== v3.4: ぜろにゃん検定（1日1問クイズ） ===== */
  /* ❓マーク：未回答の日だけ頭上にふわふわ。クリックしなければ何も起きない */
  #quizMark {
    position: absolute;
    font-size: 19px;
    cursor: pointer;
    user-select: none;
    z-index: 8;
    opacity: 0.85;
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.18));
    animation: quizFloat 2.4s ease-in-out infinite;
  }
  #quizMark:hover { opacity: 1; }
  @keyframes quizFloat {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-7px); }
  }
  /* クイズパネル：白基調・角丸・zero oneブルーのアクセント（UI層＝夜間も暗くならない） */
  #quizPanel {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%);
    width: min(320px, calc(100vw - 24px));
    max-height: calc(100vh - 20px);
    overflow-y: auto;
    background: #ffffff;
    border: 2px solid #1a5fb4;
    border-radius: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.25);
    padding: 14px;
    box-sizing: border-box;
    font-size: 13px;
    color: #333;
    z-index: 1500;
  }
  #quizPanel h4 { margin: 0 0 8px; font-size: 14px; color: #1a5fb4; }
  #quizQ { font-weight: 700; line-height: 1.55; margin-bottom: 8px; }
  .quizChoice {
    display: block;
    width: 100%;
    box-sizing: border-box;
    text-align: left;
    font-family: inherit;
    font-size: 13px;
    font-weight: 600;
    line-height: 1.45;
    background: #f4f7fb;
    border: 1.5px solid #c8d2e0;
    border-radius: 10px;
    padding: 8px 10px;
    margin: 6px 0;
    cursor: pointer;
  }
  .quizChoice:hover:enabled { background: #e8eef7; border-color: #1a5fb4; }
  .quizChoice:disabled { cursor: default; }
  .quizChoice.correct { background: #e7f1fd; border-color: #1a5fb4; color: #1a5fb4; }
  .quizChoice.wrong   { opacity: 0.5; }
  #quizVerdict { font-weight: 700; margin: 8px 0 4px; }
  #quizVerdict.ok { color: #1a5fb4; }
  #quizKaisetsu {
    background: #f4f7fb;
    border-radius: 10px;
    padding: 8px 10px;
    line-height: 1.6;
  }
  #quizStampMsg { margin-top: 8px; font-weight: 700; color: #1a5fb4; line-height: 1.55; }
  #quizStamps {
    margin-top: 10px;
    text-align: center;
    font-size: 15px;
    letter-spacing: 3px;
    cursor: default;
  }
  #quizStamps .empty { opacity: 0.15; }
  #quizClose {
    display: block;
    margin: 12px auto 0;
    font-family: inherit;
    font-size: 13px;
    font-weight: 700;
    padding: 6px 26px;
    border-radius: 10px;
    border: 1.5px solid #c8d2e0;
    background: #f4f7fb;
    cursor: pointer;
  }
  #quizClose:hover { background: #e8eef7; }

  /* 居眠り時の💤マーク */
  #zzz {
    position: absolute;
    font-size: 22px;
    opacity: 0;
    pointer-events: none;
    z-index: 9;
  }
  #zzz.show { opacity: 1; animation: zzzFloat 2.4s ease-in-out infinite; }
  @keyframes zzzFloat {
    0%   { transform: translate(0, 0)    scale(0.9); opacity: .3; }
    50%  { transform: translate(8px, -18px) scale(1.1); opacity: 1; }
    100% { transform: translate(16px, -34px) scale(0.9); opacity: 0; }
  }

  /* ===== 名札（キャラ頭上の名前ラベル） ===== */
  .nametag {
    position: absolute;
    transform: translateX(-50%);
    background: rgba(255,255,255,0.88);
    border: 1.5px solid #c8d2e0;
    color: #44506a;
    font-size: 11px;
    font-weight: 700;
    padding: 1px 8px;
    border-radius: 999px;
    white-space: nowrap;
    pointer-events: none;
    z-index: 11;
  }

  /* ===== UI（バッジ・歯車・設定パネル・モーダル）はstageの外＝夜間も暗くならない ===== */
  .hidden { display: none !important; }

  /* 出勤人数バッジ（左上・控えめ） */
  #badge {
    position: fixed;
    top: 8px;
    left: 8px;
    background: rgba(255,255,255,0.72);
    border: 1px solid rgba(0,0,0,0.08);
    color: #44506a;
    font-size: 12px;
    font-weight: 700;
    padding: 3px 10px;
    border-radius: 999px;
    cursor: pointer;
    user-select: none;
    z-index: 900;
  }

  /* 設定（⚙）ボタン：右上・半透明、ホバーでくっきり */
  #gearBtn {
    position: fixed;
    top: 8px;
    right: 8px;
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: rgba(255,255,255,0.55);
    border: 1px solid rgba(0,0,0,0.08);
    font-size: 18px;
    line-height: 32px;
    text-align: center;
    cursor: pointer;
    user-select: none;
    opacity: 0.45;
    transition: opacity .2s ease;
    z-index: 1000;
  }
  #gearBtn:hover { opacity: 1; }

  /* 設定パネル */
  #panel {
    position: fixed;
    top: 48px;
    right: 8px;
    width: 264px;
    max-height: calc(100vh - 64px);
    overflow-y: auto;
    background: rgba(255,255,255,0.97);
    border: 1px solid #d8dee8;
    border-radius: 14px;
    box-shadow: 0 8px 26px rgba(0,0,0,0.22);
    padding: 12px;
    box-sizing: border-box;
    font-size: 13px;
    color: #333;
    z-index: 1001;
  }
  #panel h3 {
    margin: 0 0 8px;
    font-size: 14px;
    color: #1a5fb4;
  }
  #panel .sec { margin-bottom: 10px; }
  #panel .hint { font-size: 11px; color: #888; margin: 4px 0 0; }
  #panel button {
    font-family: inherit;
    font-size: 12px;
    border: 1px solid #c8d2e0;
    background: #f4f7fb;
    border-radius: 8px;
    padding: 4px 10px;
    cursor: pointer;
  }
  #panel button:hover { background: #e8eef7; }
  #panel button:disabled { opacity: .45; cursor: not-allowed; }
  #addBtn {
    width: 100%;
    font-weight: 700;
    color: #1a5fb4;
    padding: 7px 0 !important;
  }
  .memberRow {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 2px;
    border-bottom: 1px dashed #e2e8f0;
  }
  .memberRow img.thumb {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    object-fit: cover;
    background: #eef2f8;
    flex: none;
  }
  .memberRow .mName {
    flex: 1;
    font-weight: 700;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .memberRow .iconBtn {
    border: none !important;
    background: none !important;
    padding: 2px 3px !important;
    font-size: 13px;
  }
  /* 出勤トグルスイッチ */
  .switch { position: relative; display: inline-block; width: 34px; height: 19px; flex: none; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .knob {
    position: absolute; inset: 0;
    background: #c5ccd8;
    border-radius: 999px;
    transition: background .2s;
    cursor: pointer;
  }
  .switch .knob::before {
    content: "";
    position: absolute;
    width: 15px; height: 15px;
    left: 2px; top: 2px;
    background: #fff;
    border-radius: 50%;
    transition: transform .2s;
    box-shadow: 0 1px 3px rgba(0,0,0,.3);
  }
  .switch input:checked + .knob { background: #1a5fb4; }
  .switch input:checked + .knob::before { transform: translateX(15px); }

  .chkRow { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .btnRow2 { display: flex; gap: 6px; margin-top: 6px; }
  .btnRow2 button { flex: 1; }

  /* ===== なかま編集モーダル ===== */
  #editorModal {
    position: fixed;
    inset: 0;
    background: rgba(20,28,45,0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 2000;
  }
  #editorModal .card {
    width: 290px;
    max-height: calc(100vh - 30px);
    overflow-y: auto;
    background: #fff;
    border-radius: 16px;
    padding: 16px;
    box-sizing: border-box;
    box-shadow: 0 12px 40px rgba(0,0,0,0.35);
    font-size: 13px;
    color: #333;
  }
  #editorModal h3 { margin: 0 0 10px; font-size: 15px; color: #1a5fb4; }
  #cropBox {
    width: min(220px, 60vmin);   /* 狭い埋め込み枠（高さ250px等）でも収まるよう vmin 連動 */
    height: min(220px, 60vmin);
    margin: 0 auto;
    border-radius: 50%;
    overflow: hidden;
    background: #e8edf4;
    position: relative;
    touch-action: none;
    cursor: grab;
    box-shadow: 0 0 0 3px #1a5fb4 inset;
  }
  #cropImg {
    position: absolute;
    left: 0;
    top: 0;
    user-select: none;
    -webkit-user-drag: none;
    pointer-events: none;
    max-width: none;
  }
  #zoom { width: 100%; margin-top: 8px; }
  #editorModal .hint { font-size: 11px; color: #888; margin: 2px 0 8px; text-align: center; }
  #editorModal label.fld { display: block; font-weight: 700; margin: 8px 0 4px; }
  #nameInput {
    width: 100%;
    box-sizing: border-box;
    font-family: inherit;
    font-size: 14px;
    padding: 6px 8px;
    border: 1.5px solid #c8d2e0;
    border-radius: 8px;
  }
  #colorRow { display: flex; gap: 8px; margin-top: 4px; }
  .swatch {
    width: 30px; height: 30px;
    border-radius: 50%;
    cursor: pointer;
    border: 3px solid transparent;
    box-sizing: border-box;
  }
  .swatch.sel { border-color: #333; box-shadow: 0 0 0 2px #fff inset; }
  #editorModal .btnRow {
    display: flex; gap: 8px; margin-top: 14px;
  }
  #editorModal .btnRow button {
    flex: 1;
    font-family: inherit;
    font-size: 14px;
    font-weight: 700;
    padding: 8px 0;
    border-radius: 10px;
    cursor: pointer;
    border: 1.5px solid #c8d2e0;
    background: #f4f7fb;
  }
  #edOK { background: #1a5fb4 !important; color: #fff; border-color: #1a5fb4 !important; }

  /* ===== v3.3: 登録モードタブ＋イラストプレビュー ===== */
  #modeTabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .modeTab {
    flex: 1;
    font-family: inherit;
    font-size: 12px;
    font-weight: 700;
    padding: 7px 4px;
    border-radius: 10px;
    border: 1.5px solid #c8d2e0;
    background: #f4f7fb;
    color: #5a6b7b;
    cursor: pointer;
    line-height: 1.35;
  }
  .modeTab.sel {
    background: #1a5fb4;
    border-color: #1a5fb4;
    color: #fff;
  }
  .modeTab .sub { display: block; font-weight: 400; font-size: 10px; opacity: .85; }
  #artPreviewBox {
    width: min(220px, 60vmin);
    height: min(220px, 60vmin);
    margin: 0 auto;
    border-radius: 12px;
    box-sizing: border-box;
    border: 2px solid #c8d2e0;
    /* 市松模様＝透過部分の確認用 */
    background-color: #ffffff;
    background-image:
      linear-gradient(45deg, #dde2ea 25%, transparent 25%, transparent 75%, #dde2ea 75%),
      linear-gradient(45deg, #dde2ea 25%, transparent 25%, transparent 75%, #dde2ea 75%);
    background-size: 16px 16px;
    background-position: 0 0, 8px 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }
  #artPreview {
    max-width: 96%;
    max-height: 96%;
    user-select: none;
    -webkit-user-drag: none;
  }

  /* ===== 赤字トースト（alert代替。Notionのサンドボックスiframeではダイアログが無効のため） ===== */
  #toast {
    position: fixed;
    left: 50%;
    bottom: 14px;
    transform: translateX(-50%) translateY(8px);
    max-width: calc(100vw - 24px);
    box-sizing: border-box;
    background: rgba(255,255,255,0.96);
    border: 2px solid #c0392b;
    color: #c0392b;
    font-size: 13px;
    font-weight: 700;
    line-height: 1.5;
    padding: 8px 14px;
    border-radius: 10px;
    box-shadow: 0 6px 18px rgba(0,0,0,0.25);
    opacity: 0;
    pointer-events: none;
    transition: opacity .3s ease, transform .3s ease;
    z-index: 3000;
  }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
</style>
</head>

<script>
/* =========================================================================
   ぜろにゃん お散歩ウィジェット v3.4 ── 調整パラメータ（ここをいじればOK）
   1枚絵のキャラを CSS/JS の transform だけで動かしています。
   v3: なかま追加（画像ドロップ→デフォルメ）・出退勤・名札・出勤バッジ・
       掛け合いセリフ・エクスポート/インポート
   v3.2: 画像差し替え（しっぽ完全版）・なでなで反応・季節の背景演出
   v3.3: オリジナルキャラ登録モード（🎨イラストで登録＝art型。AI生成等の
         完成イラストを白背景透過→そのまま全身キャラとして歩かせる）
   v3.4: MVV刷り込み（受動層=MVVセリフを既存セリフに低比率で混入 /
         能動層=ぜろにゃん検定・1日1問の3択クイズ＋肉球スタンプ）
   ========================================================================= */

/* --- 大きさ・速度 --- */
var HEIGHT_RATIO = 0.78;   // ぜろにゃんの高さ＝画面高さの何割か（0.70〜0.80目安）
var WALK_SPEED   = 0.85;   // 歩く速度（px/frame相当）
var DASH_SPEED   = 3.2;    // ダッシュ速度

/* --- 吹き出し --- */
var BUBBLE_MIN_MS  = 6000;  // 吹き出しを出す最短間隔
var BUBBLE_MAX_MS  = 11000; // 最長間隔
var BUBBLE_SHOW_MS = 4200;  // 吹き出しの表示時間

/* --- 行動の1区切りの長さ（ミリ秒）。状態ごとにランダム範囲 --- */
var ACTION_DURATION = {
  walk: [3500, 7000],
  idle: [3000, 6000],
  jump: [1500, 2600],
  dash: [1200, 2200],
  turn: [700, 1100],
  doze: [5000, 9000]   // うとうと
};

/* --- 時間帯ごとの行動の出やすさ（重み）。深夜は doze/idle 高め --- */
/* ゾーン: day(日中) / evening(夕〜夜) / night(深夜) */
var ACTION_WEIGHTS = {
  day:     { walk: 5, idle: 3, jump: 2, dash: 2, turn: 2, doze: 0 },
  evening: { walk: 4, idle: 4, jump: 1, dash: 1, turn: 2, doze: 1 },
  night:   { walk: 2, idle: 4, jump: 0, dash: 0, turn: 1, doze: 6 } // 深夜は眠そうに
};

/* --- 気分演出（明るさ・動作スピード倍率） --- */
var MOOD = {
  day:     { brightness: 1.00, speedMul: 1.00 },
  evening: { brightness: 0.92, speedMul: 0.85 },
  night:   { brightness: 0.72, speedMul: 0.60 } // 深夜は暗め＆スロー
};

/* --- v3: なかま関連 --- */
var MEMBER_SCALE     = 0.62;       // なかまの高さ＝ぜろにゃん比（やや小さめ）
var MEMBER_MAX       = 8;          // なかまの上限人数
var ENTER_SPEED_MUL  = 1.6;        // 出退勤の歩き速度（WALK_SPEED比）
var NAMETAG_DEFAULT  = true;       // 名札の初期表示
var BADGE_DEFAULT    = true;       // 出勤バッジの初期表示
var FACE_DATAURL_MAX = 137000;     // 顔画像dataURLの上限文字数（≒100KB）

/* --- v3.3: イラスト登録（art型）関連 --- */
var ART_SCALE         = 0.85;      // art型キャラの高さ＝ぜろにゃん比
var ART_HEIGHTS       = [512, 448, 384, 320, 256]; // 出力高さ候補（容量超過時に段階縮小）
var ART_DATAURL_MAX   = 205000;    // artイラストdataURLの上限文字数（≒150KB）
var ART_BG_TOLERANCE  = 30;        // 背景透過の色許容差（0〜255目安。大きいほど広く消える）
var ART_OPAQUE_RATIO  = 0.97;      // 不透明画素がこの比率以上なら「透過なし」→背景除去を実行
var ART_WORK_MAX_SIDE = 1024;      // 背景除去処理時の作業解像度上限（負荷対策）
var KAKEAI_COOLDOWN_MS = 45000;    // 掛け合いセリフの最短間隔
var PET_COOLDOWN_MS    = 2000;     // v3.2: なでなでの連打防止（1キャラあたり）
var SEASON_MAX         = 10;       // v3.2: 季節パーティクルの最大数（低負荷・控えめ）
var SEASON_DEFAULT     = true;     // v3.2: 季節演出の初期ON/OFF

/* --- v3.4: MVVセリフ（受動層）。総量は増やさず中身の配合だけ変える --- */
var MVV_RATIO_DEFAULT   = 0.30;    // 通常帯のMVVセリフ混入率
var MVV_RATIO_PROTECTED = 0.10;    // 労基重点帯（lunch/overtimeEarly/overtime/midnight/weekend）の混入率

/* --- v3.4: ぜろにゃん検定（能動層・1日1問の3択クイズ） --- */
var QUIZ_ENABLED_DEFAULT = true;               // 設定パネル初期値
var QUIZ_STAMP_GOAL      = 12;                 // 合格証までの正解数（肉球スタンプ）
var QUIZ_STORAGE_KEY     = 'zeronyan_quiz_v1'; // {lastDate, answeredToday, stampCount, deckIndex, shuffledDeck}

var STORAGE_KEY_MEMBERS  = 'zeronyan_v3_members';
var STORAGE_KEY_SETTINGS = 'zeronyan_v3_settings';

/* 作業服カラー（先頭がデフォルト＝zero oneブルー） */
var MEMBER_COLORS = ['#1a5fb4', '#2e9e5b', '#e8762d', '#c84b5f', '#5a6b7b'];

/* =========================================================================
   セリフ表（労基観点：休憩取得の促進・長時間／深夜労働の抑制）
   ★セリフの追加・編集はこの LINES オブジェクトを書き換えてください。
   各時間帯の配列に文字列を足すだけでランダム候補が増えます。
   ========================================================================= */
var LINES = {
  earlyMorning: [ // 5:00-8:59
    "おはようにゃ！早いね、無理は禁物だにゃ",
    "今日もご安全に、いってらっしゃいにゃ"
  ],
  morning: [      // 9:00-11:59
    "ヨシ！今日も安全第一でいくにゃ",
    "集中タイムにゃ、ご安全に",
    "指差し確認ヨシ！"
  ],
  lunch: [        // 12:00-12:59（休憩取得の促進＝労基法34条）
    "お昼だにゃ！ちゃんと休憩とってにゃ🍙",
    "ごはんは抜いちゃダメだにゃ"

function rand(min, max){ return Math.random() * (max - min) + min; }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function clamp255(v){ return v < 0 ? 0 : (v > 255 ? 255 : v); }

/* --- 時刻 → 時間帯キー（セリフ用）。土日は曜日優先 --- */
function getTimeKey() {
  var now = new Date();
  var day = now.getDay();      // 0=日, 6=土
  if (day === 0 || day === 6) return 'weekend';
  var h = now.getHours();
  if (h >= 5  && h <= 8)  return 'earlyMorning';
  if (h >= 9  && h <= 11) return 'morning';
  if (h === 12)           return 'lunch';
  if (h >= 13 && h <= 16) return 'afternoon';
  if (h === 17)           return 'beforeClose';
  if (h >= 18 && h <= 19) return 'overtimeEarly';
  if (h >= 20 && h <= 21) return 'overtime';
  return 'midnight';           // 22:00-翌4:59
}

/* --- 時刻 → 気分ゾーン（行動重み・明るさ用） --- */
function getMoodZone() {
  var h = new Date().getHours();
  if (h >= 22 || h <= 4) return 'night';     // 深夜
  if (h >= 18)           return 'evening';   // 夕〜夜
  return 'day';                              // 日中
}

/* =========================================================================
   画像加工（すべてブラウザ内のcanvas処理。AI・外部API不使用）
   顔: 円形クロップ → 彩度アップ＋ポスタライズ（漫画調）→ 白フチ＋アウトライン
   体: canvasで描くちびキャラ（2.5頭身・作業服・選択色）
   ========================================================================= */

/* 色を暗く/明るくする（factor<1で暗く） */
function shade(hex, factor) {
  var r = parseInt(hex.slice(1, 3), 16);
  var g = parseInt(hex.slice(3, 5), 16);
  var b = parseInt(hex.slice(5, 7), 16);
  r = Math.round(clamp255(r * factor));
  g = Math.round(clamp255(g * factor));
  b = Math.round(clamp255(b * factor));
  return 'rgb(' + r + ',' + g + ',' + b + ')';
}

function roundRectPath(ctx, x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

/* 顔ステッカー生成: 元画像の正方形領域(sx,sy,sw)を size px の円形ステッカーに */
function makeFaceSticker(srcImg, sx, sy, sw, size) {
  // 1) クロップ＆縮小
  var photoR = size * 0.43;                 // 写真円の半径
  var tmp = document.createElement('canvas');
  tmp.width = tmp.height = Math.round(photoR * 2);
  var tctx = tmp.getContext('2d');
  tctx.drawImage(srcImg, sx, sy, sw, sw, 0, 0, tmp.width, tmp.height);

  // 2) 彩度アップ＋ポスタライズ（漫画調）
  try {
    var img = tctx.getImageData(0, 0, tmp.width, tmp.height);
    var d = img.data, i, r, g, b, gray;
    var SAT = 1.45, STEP = 42.5; // 彩度倍率 / ポスタライズ階調幅
    for (i = 0; i < d.length; i += 4) {
      r = d[i]; g = d[i + 1]; b = d[i + 2];
      gray = (r + g + b) / 3;
      r = gray + (r - gray) * SAT;
      g = gray + (g - gray) * SAT;
      b = gray + (b - gray) * SAT;
      d[i]     = clamp255(Math.round(r / STEP) * STEP);
      d[i + 1] = clamp255(Math.round(g / STEP) * STEP);
      d[i + 2] = clamp255(Math.round(b / STEP) * STEP);
    }
    tctx.putImageData(img, 0, 0);
  } catch (e) { /* 加工に失敗してもクロップ画像のまま続行 */ }

  // 3) ステッカー化（円形クリップ＋白フチ＋濃色アウトライン）
  var cv = document.createElement('canvas');
  cv.width = cv.height = size;
  var ctx = cv.getContext('2d');
  var c = size / 2;
  ctx.save();
  ctx.beginPath();
  ctx.arc(c, c, photoR, 0, Math.PI * 2);
  ctx.clip();
  ctx.drawImage(tmp, c - photoR, c - photoR);
  ctx.restore();
  // 白フチ（太め）
  ctx.beginPath();
  ctx.arc(c, c, photoR + size * 0.028, 0, Math.PI * 2);
  ctx.lineWidth = size * 0.056;
  ctx.strokeStyle = '#ffffff';
  ctx.stroke();
  // 濃色アウトライン
  ctx.beginPath();
  ctx.arc(c, c, photoR + size * 0.062, 0, Math.PI * 2);
  ctx.lineWidth = size * 0.018;
  ctx.strokeStyle = '#2b3550';
  ctx.stroke();
  return cv;
}

/* 顔ステッカーをdataURL化（100KB目安を超えたら段階的に縮小） */
function faceToDataURL(srcImg, sx, sy, sw) {
  var sizes = [256, 200, 160, 128];
  var url = '';
  for (var i = 0; i < sizes.length; i++) {
    url = makeFaceSticker(srcImg, sx, sy, sw, sizes[i]).toDataURL('image/png');
    if (url.length <= FACE_DATAURL_MAX) return url;
  }
  return url; // 最小サイズでも超える場合はそのまま（保存時にガード）
}

/* =========================================================================
   v3.3: イラスト登録（art型）の画像処理
   AI生成等の完成イラストをそのまま全身キャラにする。背景が不透過（白1色等）
   の場合は、四隅からのflood fillで「外周につながる背景色」だけを透過化する。
   キャラ内部の白（目・歯・ヘルメット等）は外周とつながっていないので残る。
   （ぜろにゃん本体の切り抜きで実績のある方式のブラウザ内実装）
   ========================================================================= */

/* 画像 → 作業canvas（長辺を ART_WORK_MAX_SIDE に収めて負荷を抑える） */
function artToWorkCanvas(img) {
  var w = img.naturalWidth, h = img.naturalHeight;
  var scale = Math.min(1, ART_WORK_MAX_SIDE / Math.max(w, h));
  var cv = document.createElement('canvas');
  cv.width  = Math.max(1, Math.round(w * scale));
  cv.height = Math.max(1, Math.round(h * scale));
  cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
  return cv;
}

/* 不透明画素の比率（既に透過PNGかどうかの判定用） */
function artOpaqueRatio(data) {
  var n = data.length / 4, opaque = 0;
  for (var i = 3; i < data.length; i += 4) {
    if (data[i] > 16) opaque++;
  }
  return n ? (opaque / n) : 1;
}

/* 四隅からのflood fillで外周背景（白/単色）のみ透過化。tolerance=色許容差 */
function artRemoveOuterBackground(cv, tolerance) {
  var ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;
  var img = ctx.getImageData(0, 0, W, H);
  var d = img.data;
  var visited = new Uint8Array(W * H);
  var stack = [];
  var corners = [0, W - 1, (H - 1) * W, H * W - 1];
  var tol2 = tolerance * tolerance * 3;   // RGB3chの二乗距離合計と比較

  for (var ci = 0; ci < corners.length; ci++) {
    var seed = corners[ci];
    if (visited[seed]) continue;
    if (d[seed * 4 + 3] < 16) continue;   // 角が既に透明＝背景除去不要
    var sr = d[seed * 4], sg = d[seed * 4 + 1], sb = d[seed * 4 + 2];
    visited[seed] = 1;
    stack.push(seed);
    while (stack.length) {
      var q = stack.pop();
      var qi = q * 4;
      var dr = d[qi] - sr, dg = d[qi + 1] - sg, db = d[qi + 2] - sb;
      if (dr * dr + dg * dg + db * db > tol2) continue;  // 背景色から外れたら進まない
      d[qi + 3] = 0;                                     // 透過化
      var x = q % W, y = (q - x) / W;
      if (x > 0     && !visited[q - 1]) { visited[q - 1] = 1; stack.push(q - 1); }
      if (x < W - 1 && !visited[q + 1]) { visited[q + 1] = 1; stack.push(q + 1); }
      if (y > 0     && !visited[q - W]) { visited[q - W] = 1; stack.push(q - W); }
      if (y < H - 1 && !visited[q + W]) { visited[q + W] = 1; stack.push(q + W); }
    }
  }
  ctx.putImageData(img, 0, 0);
}

/* 完全透明マージンをトリムし、高さ heightPx 以下に縮小したcanvasを返す */
function artTrimAndResize(cv, heightPx) {
  var ctx = cv.getContext('2d');
  var W = cv.width, H = cv.height;
  var d = ctx.getImageData(0, 0, W, H).data;
  var minX = W, minY = H, maxX = -1, maxY = -1, x, y;
  for (y = 0; y < H; y++) {
    for (x = 0; x < W; x++) {
      if (d[(y * W + x) * 4 + 3] > 8) {
        if (x < minX) minX = x;
        if (x > maxX) maxX = x;
        if (y < minY) minY = y;
        if (y > maxY) maxY = y;
      }
    }
  }
  if (maxX < 0) { minX = 0; minY = 0; maxX = W - 1; maxY = H - 1; }  // 全透明なら全体
  var tw = maxX - minX + 1, th = maxY - minY + 1;
  var outH = Math.min(heightPx, th);
  var outW = Math.max(1, Math.round(tw * outH / th));
  var out = document.createElement('canvas');
  out.width = outW; out.height = outH;
  out.getContext('2d').drawImage(cv, minX, minY, tw, th, 0, 0, outW, outH);
  return out;
}

/* イラスト → 登録用dataURL。{url, removedBg} を返す（150KB目安に段階縮小） */
function processArtImage(img) {
  var work = artToWorkCanvas(img);
  var ctx = work.getContext('2d');
  var data = ctx.getImageData(0, 0, work.width, work.height).data;
  var removedBg = false;
  if (artOpaqueRatio(data) >= ART_OPAQUE_RATIO) {  // 透過がほぼ無い＝白背景等とみなす
    artRemoveOuterBackground(work, ART_BG_TOLERANCE);
    removedBg = true;
  }
  var url = '';
  for (var i = 0; i < ART_HEIGHTS.length; i++) {
    url = artTrimAndResize(work, ART_HEIGHTS[i]).toDataURL('image/png');
    if (url.length <= ART_DATAURL_MAX) break;
  }
  return { url: url, removedBg: removedBg };
}

/* ちびキャラの体（作業服）を描く。キャンバスは 360x480 前提 */
function drawChibiBody(ctx, color) {
  var dark = shade(color, 0.62);
  var line = '#2b3550';
  ctx.lineJoin = 'round';
  ctx.lineCap = 'round';

  // くつ
  ctx.fillStyle = '#262d40';
  ctx.beginPath(); ctx.ellipse(151, 444, 27, 13, 0, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.ellipse(209, 444, 27, 13, 0, 0, Math.PI * 2); ctx.fill();

  // あし
  ctx.fillStyle = '#3a4663';
  roundRectPath(ctx, 136, 386, 32, 52, 13); ctx.fill();
  roundRectPath(ctx, 192, 386, 32, 52, 13); ctx.fill();

  // うで（左右）
  ctx.fillStyle = color;
  ctx.strokeStyle = line;
  ctx.lineWidth = 6;
  roundRectPath(ctx, 74, 262, 40, 98, 20);  ctx.fill(); ctx.stroke();
  roundRectPath(ctx, 246, 262, 40, 98, 20); ctx.fill(); ctx.stroke();

  // て（まるい手袋）
  ctx.fillStyle = '#f6cfa6';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(94, 366, 15, 0, Math.PI * 2);  ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(266, 366, 15, 0, Math.PI * 2); ctx.fill(); ctx.stroke();

  // どう（作業ジャケット）
  ctx.fillStyle = color;
  ctx.lineWidth = 7;
  roundRectPath(ctx, 103, 238, 154, 172, 42); ctx.fill(); ctx.stroke();

  // ファスナー
  ctx.strokeStyle = dark;
  ctx.lineWidth = 5;
  ctx.beginPath(); ctx.moveTo(180, 250); ctx.lineTo(180, 402); ctx.stroke();

  // 胸ポケットのライン
  ctx.beginPath(); ctx.moveTo(120, 330); ctx.lineTo(150, 330); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(210, 330); ctx.lineTo(240, 330); ctx.stroke();

  // 反射材ふうの白ライン（建設会社の作業服らしさ）
  ctx.strokeStyle = 'rgba(255,255,255,0.85)';
  ctx.lineWidth = 7;
  ctx.beginPath(); ctx.moveTo(108, 372); ctx.lineTo(252, 372); ctx.stroke();
}

/* 顔ステッカー(Image) + 体 → 全身スプライト(dataURL)。比率は 360:480 固定 */
var SPRITE_W = 360, SPRITE_H = 480;
function buildSprite(faceImg, color) {
  var cv = document.createElement('canvas');
  cv.width = SPRITE_W; cv.height = SPRITE_H;
  var ctx = cv.getContext('2d');
  // 足元の楕円影（ぜろにゃんのテイストに合わせる）
  ctx.fillStyle = 'rgba(0,0,0,0.16)';
  ctx.beginPath(); ctx.ellipse(180, 454, 100, 15, 0, 0, Math.PI * 2); ctx.fill();
  drawChibiBody(ctx, color);
  // 顔（大きい頭＝2.5頭身）。体の上にステッカーを重ねる
  ctx.drawImage(faceImg, 180 - 132, 8, 264, 264);
  return cv.toDataURL('image/png');
}

/* =========================================================================
   キャラクター実行エンジン（ぜろにゃん＋なかま共通）
   walk / idle / jump / dash / turn / doze ＋ enter / preExit / exit
   ========================================================================= */
var chars = [];          // chars[0] = ぜろにゃん
var lastKakeai = 0;

function makeBubbleEl() {
  var el = document.createElement('div');
  el.className = 'bubble';
  stage.appendChild(el);
  return el;
}
function makeTagEl(name) {
  var el = document.createElement('div');
  el.className = 'nametag';
  el.textContent = name;
  stage.appendChild(el);
  return el;
}

/* キャラのサイズ再計算 */
function resizeChar(c) {
  var ratio = c.isCat ? 1 : ((c.member && c.member.type === 'art') ? ART_SCALE : MEMBER_SCALE);  // v3.3
  c.h = window.innerHeight * HEIGHT_RATIO * ratio;
  c.w = c.h * c.imgRatio;
  c.el.style.height = c.h + 'px';
  if (c.state !== 'enter' && c.state !== 'exit') {
    if (c.posX > window.innerWidth - c.w) c.posX = Math.max(0, window.innerWidth - c.w);
  }
}
var seasonResizeTimer = null;
function resize() {
  for (var i = 0; i < chars.length; i++) resizeChar(chars[i]);
  if (seasonResizeTimer) clearTimeout(seasonResizeTimer);
  seasonResizeTimer = setTimeout(seasonInit, 400);  // v3.2: 粒子を新しい画面サイズで再配置
}
window.addEventListener('resize', resize);

/* --- 気分（明るさ）を反映 --- */
function applyMood() {
  stage.style.filter = 'brightness(' + MOOD[getMoodZone()].brightness + ')';
}

/* 重み付きで次の行動を選ぶ */
function chooseAction() {
  var w = ACTION_WEIGHTS[getMoodZone()];
  var total = 0, k;
  for (k in w) total += w[k];
  var r = Math.random() * total;
  for (k in w) {
    r -= w[k];
    if (r <= 0) return k;
  }
  return 'idle';
}

/* 次の行動へ遷移 */
function nextStateFor(c, now) {
  c.state = chooseAction();
  c.animStart = now;
  var range = ACTION_DURATION[c.state] || [3000, 5000];
  c.stateEndAt = now + rand(range[0], range[1]);

  // 行動開始時の小芝居
  if (c.state === 'turn') {
    c.dir = -c.dir;                          // 振り向き
  } else if (c.state === 'walk' || c.state === 'dash') {
    if (Math.random() < 0.4) c.dir = -c.dir; // たまに向きを変えて歩き出す
  }
  if (c.isCat) toggleZzz(c.state === 'doze'); // doze中だけ💤（ぜろにゃんのみ）
}

function toggleZzz(on) {
  if (on) zzz.classList.add('show');
  else    zzz.classList.remove('show');
}

/* --- 吹き出し --- */
function showCharBubble(c, text, ms) {
  if (!c.visible) return;
  c.bubbleEl.textContent = text;
  var bx = c.posX + c.w * 0.45;
  var maxLeft = window.innerWidth - c.bubbleEl.offsetWidth - 8;
  if (bx > maxLeft) bx = maxLeft;
  if (bx < 8) bx = 8;
  c.bubbleEl.style.left = bx + 'px';
  c.bubbleEl.style.top  = Math.max(8, window.innerHeight - c.h * 1.02) + 'px';
  c.bubbleEl.classList.add('show');
  if (c.bubbleHideTimer) clearTimeout(c.bubbleHideTimer);
  c.bubbleHideTimer = setTimeout(function () {
    c.bubbleEl.classList.remove('show');
  }, ms || BUBBLE_SHOW_MS);
}

/* v3.4: 時刻連動セリフの抽選。ぜろにゃんのみMVVセリフを所定比率で混入する。
   通常帯=MVV_RATIO_DEFAULT(30%) / 労基重点帯=MVV_RATIO_PROTECTED(10%)。
   労基重点帯では休憩取得・退勤促進（既存の労基セリフ）を優先する設計 */
var MVV_PROTECTED_KEYS = { lunch: 1, overtimeEarly: 1, overtime: 1, midnight: 1, weekend: 1 };
function pickTimeLine(c) {
  var key = getTimeKey();
  if (c.isCat) {
    var mvv = LINES_MVV[key];
    var ratio = MVV_PROTECTED_KEYS[key] ? MVV_RATIO_PROTECTED : MVV_RATIO_DEFAULT;
    if (mvv && mvv.length && Math.random() < ratio) return pick(mvv);
    // 該当帯のMVVセリフが空でも既存LINESにフォールバック（落ちない）
  }
  return pick((c.isCat ? LINES : LINES_MEMBER)[key]);
}

/* 時刻連動セリフをランダム間隔で繰り返す（キャラごと） */
function scheduleBubble(c, firstDelay) {
  c.bubbleTimer = setTimeout(function tick() {
    if (c.visible && c.state !== 'enter' && c.state !== 'preExit' && c.state !== 'exit') {
      showCharBubble(c, pickTimeLine(c), BUBBLE_SHOW_MS);
    }
    c.bubbleTimer = setTimeout(tick, rand(BUBBLE_MIN_MS, BUBBLE_MAX_MS));
  }, firstDelay);
}

/* --- 出勤（画面端から歩いて登場） --- */
function spawnEnter(c) {
  c.visible = true;
  c.el.style.display = '';
  var fromLeft = Math.random() < 0.5;
  c.targetX = rand(window.innerWidth * 0.15, Math.max(window.innerWidth * 0.6, window.innerWidth - c.w - 40));
  if (fromLeft) { c.posX = -c.w - 10; c.dir = 1; }
  else          { c.posX = window.innerWidth + 10; c.dir = -1; }
  c.state = 'enter';
  c.animStart = performance.now();
  c.stateEndAt = 0;
  updateBadge();
}

/* --- 配置のみ（ページ読込時の出勤者） --- */
function placeDirect(c, index) {
  c.visible = true;
  c.el.style.display = '';
  c.posX = window.innerWidth * (0.12 + 0.1 * index) + rand(-20, 20);
  c.dir = Math.random() < 0.5 ? 1 : -1;
  c.state = 'idle';
  c.stateEndAt = 0;
  updateBadge();
}

/* --- 退勤（あいさつ→端へ歩いて退場→非表示） --- */
function beginExit(c) {
  if (!c.visible) return;
  showCharBubble(c, 'おつかれさまでした！', 2600);
  c.state = 'preExit';
  c.animStart = performance.now();
  c.stateEndAt = performance.now() + 1500;
}

function despawn(c) {
  c.visible = false;
  c.el.style.display = 'none';
  c.bubbleEl.classList.remove('show');
  c.tagEl.style.display = 'none';
  updateBadge();
}

/* --- 1キャラぶんの毎フレーム更新 --- */
function stepChar(c, now) {
  if (!c.visible) return;
  var speedMul = MOOD[getMoodZone()].speedMul;
  var t = (now - c.animStart) / 1000;     // 状態開始からの経過秒
  var ty = 0, rot = 0;

  if (c.state === 'enter') {
    c.posX += WALK_SPEED * ENTER_SPEED_MUL * c.dir * Math.max(speedMul, 0.7);
    ty  = -Math.abs(Math.sin(t * 8)) * (c.h * 0.025);
    rot = Math.sin(t * 8) * 2.2;
    if ((c.dir === 1 && c.posX >= c.targetX) || (c.dir === -1 && c.posX <= c.targetX)) {
      showCharBubble(c, greetingLine(), 3200);
      nextStateFor(c, now);
    }
  } else if (c.state === 'preExit') {
    ty = Math.sin(t * 2) * (c.h * 0.008);
    if (now >= c.stateEndAt) {
      c.state = 'exit';
      c.animStart = now;
      c.dir = (c.posX + c.w / 2 < window.innerWidth / 2) ? -1 : 1; // 近い端へ
    }
  } else if (c.state === 'exit') {
    c.posX += WALK_SPEED * ENTER_SPEED_MUL * c.dir * Math.max(speedMul, 0.7);
    ty  = -Math.abs(Math.sin(t * 8)) * (c.h * 0.025);
    rot = Math.sin(t * 8) * 2.2;
    if (c.posX < -c.w - 20 || c.posX > window.innerWidth + 20) {
      despawn(c);
      return;
    }
  } else {
    if (!c.stateEndAt || now >= c.stateEndAt) nextStateFor(c, now);

    switch (c.state) {
      case 'walk':
        c.posX += WALK_SPEED * c.dir * speedMul;
        ty  = -Math.abs(Math.sin(t * 8)) * (c.h * 0.025); // ぴょこ上下バウンド
        rot = Math.sin(t * 8) * 2.2;                       // 微傾き
        break;

      case 'dash':
        c.posX += DASH_SPEED * c.dir * speedMul;
        ty  = -Math.abs(Math.sin(t * 12)) * (c.h * 0.05);  // 大きめバウンド
        rot = c.dir * 8;                                    // 前傾
        break;

      case 'idle':
        ty  = Math.sin(t * 2) * (c.h * 0.008);             // 軽い呼吸（上下）
        rot = Math.sin(t * 0.8) * 1.0;                      // ときどき小さく揺れ
        break;

      case 'jump': {
        var jp = (t % 1.0);                                 // 1秒周期で1回ぴょん
        if (jp < 0.5) {
          ty = -Math.sin((jp / 0.5) * Math.PI) * (c.h * 0.22); // 高めに跳ねる
        }
        break;
      }

      case 'turn':
        ty  = -Math.abs(Math.sin(t * 6)) * (c.h * 0.02);   // 屈伸する小芝居
        rot = Math.sin(t * 6) * 3;
        break;

      case 'pet':                                          // v3.2: なでなでの喜びぴょこん
        ty  = -Math.abs(Math.sin(t * 9)) * (c.h * 0.07);
        rot = Math.sin(t * 18) * 4;
        break;

      case 'doze':
        rot = (Math.sin(t * 1.0) * 6) - 2;                 // ゆっくり傾いてコクッ
        ty  = Math.sin(t * 1.0) * (c.h * 0.01);
        break;
    }

    // 端で折り返し（向きも反転）
    if (c.posX < 0)                          { c.posX = 0; c.dir = 1; }
    if (c.posX > window.innerWidth - c.w)    { c.posX = window.innerWidth - c.w; c.dir = -1; }
  }

  c.el.style.left = c.posX + 'px';
  c.el.style.transform =
    'translateY(' + ty + 'px) rotate(' + rot + 'deg) scaleX(' + c.dir + ')';

  // 💤マークをぜろにゃんの頭上あたりに追従
  if (c.isCat) {
    zzz.style.left = (c.posX + c.w * 0.62) + 'px';
    zzz.style.top  = (window.innerHeight - c.h * 0.95) + 'px';
    // v3.4: ❓マーク（きょうの1問）も頭上に追従
    quizMark.style.left = (c.posX + c.w * 0.30) + 'px';
    quizMark.style.top  = Math.max(2, window.innerHeight - c.h * 1.06) + 'px';
  }

  // 名札をキャラ頭上に追従
  if (settings.nametag) {
    c.tagEl.style.display = '';
    c.tagEl.style.left = (c.posX + c.w / 2) + 'px';
    c.tagEl.style.top  = Math.max(2, window.innerHeight - c.h - 24) + 'px';
  } else {
    c.tagEl.style.display = 'none';
  }
}

/* =========================================================================
   v3.2: なでなで反応（クリック/タップで喜ぶ）
   - キャラ画像のクリックで発動。UI（パネル・モーダル等）はz-indexが上なので干渉しない
   - 退場アニメ中・退勤（非表示）キャラは反応しない
   - 連打対策: 1キャラ PET_COOLDOWN_MS のクールダウン
   ========================================================================= */
function spawnPetHearts(c) {
  var marks = ['❤', '💛', '♪', '💕'];
  var n = 2 + Math.floor(Math.random() * 2);   // 2〜3個
  for (var i = 0; i < n; i++) {
    var p = document.createElement('span');
    p.className = 'petHeart';
    p.textContent = pick(marks);
    p.style.left = (c.posX + c.w * (0.25 + Math.random() * 0.5)) + 'px';
    p.style.top  = Math.max(4, window.innerHeight - c.h * (0.95 + Math.random() * 0.15)) + 'px';
    p.style.animationDelay = (i * 0.12) + 's';
    stage.appendChild(p);
    (function (el) {
      setTimeout(function () {
        if (el.parentNode) el.parentNode.removeChild(el);
      }, 1900);
    })(p);
  }
}

/* 喜びジャンプ＋❤パーティクル（v3.4: ぜろにゃん検定の正解演出と共用化） */
function celebrate(c) {
  if (!c.visible) return;                                            // 退勤中は反応しない
  if (c.state === 'enter' || c.state === 'preExit' || c.state === 'exit') return; // 出退場中は反応しない
  var now = performance.now();
  if (c.isCat) toggleZzz(false);                                     // 居眠り中なら起きる
  c.state = 'pet';                                                   // その場でぴょこんと跳ねる
  c.animStart = now;
  c.stateEndAt = now + 900;
  spawnPetHearts(c);
}

function petChar(c) {
  if (!c.visible) return;                                            // 退勤中は反応しない
  if (c.state === 'enter' || c.state === 'preExit' || c.state === 'exit') return; // 出退場中は反応しない
  var now = performance.now();
  if (c.lastPetAt && now - c.lastPetAt < PET_COOLDOWN_MS) return;     // 連打防止（初回は常に許可）
  c.lastPetAt = now;

  celebrate(c);
  showCharBubble(c, pick(c.isCat ? PET_LINES : PET_LINES_MEMBER), 2600);
}

/* すれ違いざまの掛け合い（ぜろにゃん×なかま） */
function checkKakeai(now) {
  if (now - lastKakeai < KAKEAI_COOLDOWN_MS) return;
  var catC = chars[0];
  if (!catC || !catC.visible) return;
  for (var i = 1; i < chars.length; i++) {
    var mC = chars[i];
    if (!mC.visible) continue;
    if (mC.state === 'enter' || mC.state === 'preExit' || mC.state === 'exit') continue;
    var d = Math.abs((catC.posX + catC.w / 2) - (mC.posX + mC.w / 2));
    if (d < catC.w * 0.3) {
      var pair = pick(KAKEAI);
      showCharBubble(catC, pair[0], 2600);
      showCharBubble(mC,  pair[1], 2600);
      lastKakeai = now;
      break;
    }
  }
}

/* =========================================================================
   v3.4: ぜろにゃん検定（能動層・1日1問の3択クイズ）
   - その日未回答の間だけ、ぜろにゃんの頭上に❓がふわふわ浮かぶ。
     クリックしなければ何も起きない（未回答でも催促・リマインドはしない）
   - 成績・回答履歴は端末のlocalStorage（QUIZ_STORAGE_KEY）のみ。
     なかまデータの「書き出しJSON」には含めない・どこにも送信しない
   - localStorageが使えない環境では❓自体を非表示（エラーで止めない）
   - 日付判定は端末ローカル日付（既存の時刻判定と同一方針）
   ========================================================================= */
var quizMark       = document.getElementById('quizMark');
var quizPanel      = document.getElementById('quizPanel');
var quizQEl        = document.getElementById('quizQ');
var quizChoicesEl  = document.getElementById('quizChoices');
var quizResultEl   = document.getElementById('quizResult');
var quizVerdictEl  = document.getElementById('quizVerdict');
var quizKaisetsuEl = document.getElementById('quizKaisetsu');
var quizStampMsgEl = document.getElementById('quizStampMsg');
var quizStampsEl   = document.getElementById('quizStamps');
var quizCloseBtn   = document.getElementById('quizClose');

var quizState = { lastDate: '', answeredToday: false, stampCount: 0, deckIndex: 0, shuffledDeck: null };
var quizPanelDate = '';   // パネルを開いて問題を提示した日（日付跨ぎ回答のずれ防止用）

function quizTodayStr() {
  var d = new Date();   // 端末ローカル日付
  return d.getFullYear() + '-' + ('0' + (d.getMonth() + 1)).slice(-2) + '-' + ('0' + d.getDate()).slice(-2);
}

function loadQuiz() {
  if (!storageOK) return;
  try {
    var q = JSON.parse(localStorage.getItem(QUIZ_STORAGE_KEY) || 'null');
    if (q && typeof q === 'object') {
      if (typeof q.lastDate === 'string')       quizState.lastDate      = q.lastDate;
      if (typeof q.answeredToday === 'boolean') quizState.answeredToday = q.answeredToday;
      if (typeof q.stampCount === 'number' && q.stampCount >= 0) quizState.stampCount = Math.floor(q.stampCount);
      if (typeof q.deckIndex  === 'number' && q.deckIndex  >= 0) quizState.deckIndex  = Math.floor(q.deckIndex);
      if (Object.prototype.toString.call(q.shuffledDeck) === '[object Array]') quizState.shuffledDeck = q.shuffledDeck;
    }
  } catch (e) { /* 壊れたデータは無視して初期状態で続行 */ }
}

function saveQuiz() {
  if (!storageOK) return;
  try { localStorage.setItem(QUIZ_STORAGE_KEY, JSON.stringify(quizState)); }
  catch (e) { /* 保存に失敗しても動作は止めない */ }
}

/* 日付が変わっていたら「きょうの1問」を解禁 */
function quizCheckDay() {
  if (quizState.answeredToday && quizState.lastDate !== quizTodayStr()) {
    quizState.answeredToday = false;
    saveQuiz();
  }
}

function quizShuffleDeck() {
  var a = [], i, j, t;
  for (i = 0; i < QUIZ_DATA.length; i++) a.push(i);
  for (i = a.length - 1; i > 0; i--) {           // Fisher-Yates
    j = Math.floor(Math.random() * (i + 1));
    t = a[i]; a[i] = a[j]; a[j] = t;
  }
  return a;
}

/* きょう出す問題。1周目はQ1→Q12の順（正文の暗記→場面適用の順）、2周目以降はシャッフル周回 */
function quizCurrentQuestion() {
  var n = QUIZ_DATA.length;
  if (quizState.deckIndex < n) return QUIZ_DATA[quizState.deckIndex];
  if (!quizState.shuffledDeck || quizState.shuffledDeck.length !== n) {
    quizState.shuffledDeck = quizShuffleDeck();
    saveQuiz();
  }
  var idx = quizState.shuffledDeck[quizState.deckIndex % n];
  if (typeof idx !== 'number' || idx < 0 || idx >= n) idx = quizState.deckIndex % n;  // 壊れたデッキの保険
  return QUIZ_DATA[idx];
}

/* 肉球スタンプの表示（12枠。累積制なので12個ごとに1周） */
function renderQuizStamps() {
  var filled = quizState.stampCount % QUIZ_STAMP_GOAL;
  if (quizState.stampCount > 0 && filled === 0) filled = QUIZ_STAMP_GOAL;
  var html = '';
  for (var i = 0; i < QUIZ_STAMP_GOAL; i++) {
    html += '<span' + (i < filled ? '' : ' class="empty"') + '>🐾</span>';
  }
  quizStampsEl.innerHTML = html;
  quizStampsEl.title = '肉球スタンプ：通算 ' + quizState.stampCount + ' 個';
}

/* ❓マークの表示判定（検定ON・保存可能・きょう未回答・パネル非表示のときだけ） */
function updateQuizMark() {
  var show = storageOK && settings.quiz && !quizState.answeredToday && quizPanel.classList.contains('hidden');
  quizMark.classList.toggle('hidden', !show);
}

function openQuizPanel() {
  loadQuiz();      // 複数タブ対策: 別タブで回答済みなら、ここで最新状態を取り直して弾く
  quizCheckDay();
  if (!settings.quiz || quizState.answeredToday) { updateQuizMark(); return; }
  quizPanelDate = quizTodayStr();   // この問題を「提示した日」を覚えておく
  var q = quizCurrentQuestion();
  quizQEl.textContent = q.q;
  quizChoicesEl.innerHTML = '';
  quizResultEl.classList.add('hidden');
  quizVerdictEl.classList.remove('ok');
  quizStampMsgEl.textContent = '';
  var labels = ['A', 'B', 'C'];
  q.choices.forEach(function (text, idx) {
    var b = document.createElement('button');
    b.className = 'quizChoice';
    b.type = 'button';
    b.textContent = labels[idx] + '. ' + text;
    b.addEventListener('click', function () { answerQuiz(q, idx); });
    quizChoicesEl.appendChild(b);
  });
  renderQuizStamps();
  quizPanel.classList.remove('hidden');
  updateQuizMark();
}

function answerQuiz(q, idx) {
  if (quizState.answeredToday) return;   // 二重回答ガード
  var today = quizTodayStr();            // 回答時点の日付を取り直す（日付跨ぎの1問ずれ防止）
  var correct = (idx === q.answer);
  quizState.answeredToday = true;
  // パネルを開いたまま日付を跨いで回答した場合は「提示した日」の回答として記録する。
  // → 60秒間隔の quizCheckDay() が新しい日を検知して❓を復活させるので、当日分は消費されない
  quizState.lastDate = (quizPanelDate && quizPanelDate !== today) ? quizPanelDate : today;
  quizState.deckIndex++;
  if (correct) quizState.stampCount++;
  if (quizState.deckIndex >= QUIZ_DATA.length && quizState.deckIndex % QUIZ_DATA.length === 0) {
    quizState.shuffledDeck = quizShuffleDeck();   // 周回の区切りでシャッフルし直す
  }
  saveQuiz();

  // 選択肢のフィードバック（正解は青く・他は薄く。不正解でも責めない）
  var btns = quizChoicesEl.children, i;
  for (i = 0; i < btns.length; i++) {
    btns[i].disabled = true;
    btns[i].classList.add(i === q.answer ? 'correct' : 'wrong');
  }

  quizVerdictEl.textContent = correct ? 'せいかい！さすがだにゃ🎉' : 'おしいにゃ！正解はこれだにゃ👇';
  quizVerdictEl.classList.toggle('ok', correct);
  quizKaisetsuEl.textContent = '【こたえあわせ】' + q.kaisetsu;

  if (correct) {
    celebrate(chars[0]);                          // 既存なでなでの喜びジャンプを流用
    if (quizState.stampCount % QUIZ_STAMP_GOAL === 0) {
      quizStampMsgEl.textContent = '🏆 ぜろにゃん検定 合格証 — きみは立派な zero one のなかまだにゃ！これからもよろしくにゃ';
    } else {
      var remain = QUIZ_STAMP_GOAL - (quizState.stampCount % QUIZ_STAMP_GOAL);
      quizStampMsgEl.textContent = '肉球スタンプ 🐾 ゲットだにゃ！（あと' + remain + '個で合格証）';
    }
  }
  renderQuizStamps();
  quizResultEl.classList.remove('hidden');
  updateQuizMark();
}

function closeQuizPanel() {
  quizPanel.classList.add('hidden');
  updateQuizMark();
}

quizMark.addEventListener('click', openQuizPanel);
quizCloseBtn.addEventListener('click', closeQuizPanel);

/* =========================================================================
   v3.2: 季節の背景演出（控えめなアンビエント）
   - 端末の月で自動切替。パーティクルは最大 SEASON_MAX 個・opacity 0.5以下
   - メインループ（rAF）内で更新 → タブ非表示時はrAFごと止まるので低負荷
   - キャラよりz-indexが下（z=1）なのでセリフ・キャラの邪魔をしない
   ========================================================================= */
var seasonParticles = [];
var sunflowerEl = null;

function getSeasonKind() {
  var m = new Date().getMonth() + 1;
  if (m === 3 || m === 4)            return 'sakura';
  if (m === 6)                       return 'rain';
  if (m === 7 || m === 8)            return 'summer';
  if (m >= 9 && m <= 11)             return 'leaves';
  if (m === 12 || m === 1)           return 'snow';
  return null;                       // 2月・5月は演出なし
}

function seasonTeardown() {
  for (var i = 0; i < seasonParticles.length; i++) {
    var el = seasonParticles[i].el;
    if (el.parentNode) el.parentNode.removeChild(el);
  }
  seasonParticles = [];
  if (sunflowerEl && sunflowerEl.parentNode) sunflowerEl.parentNode.removeChild(sunflowerEl);
  sunflowerEl = null;
}

function seasonInit() {
  seasonTeardown();
  if (!settings.season) return;
  var kind = getSeasonKind();
  if (!kind) return;

  var count = (kind === 'rain') ? SEASON_MAX : Math.min(8, SEASON_MAX);
  for (var i = 0; i < count; i++) {
    var p = { kind: kind, x: 0, y: 0, vy: 0, sway: 0, phase: Math.random() * Math.PI * 2, el: null };
    if (kind === 'rain') {
      p.el = document.createElement('div');
      p.el.className = 'sparticle rainDrop';
      p.vy = rand(5, 8);
    } else {
      p.el = document.createElement('span');
      p.el.className = 'sparticle';
      if (kind === 'sakura')      { p.el.textContent = '🌸'; p.vy = rand(0.35, 0.8); }
      else if (kind === 'leaves') { p.el.textContent = '🍂'; p.vy = rand(0.4, 0.9); }
      else if (kind === 'snow')   { p.el.textContent = '❄';  p.vy = rand(0.3, 0.7); }
      else if (kind === 'summer') { p.el.textContent = '✨'; p.vy = 0; }  // キラキラは漂うだけ
      p.el.style.fontSize = Math.round(rand(10, 16)) + 'px';
      p.sway = rand(12, 30);
    }
    p.el.style.opacity = '0';
    p.x = rand(0, window.innerWidth);
    p.y = rand(-window.innerHeight, 0);
    if (kind === 'summer') p.y = rand(0, window.innerHeight * 0.6);  // 上半分で瞬く
    stage.appendChild(p.el);
    seasonParticles.push(p);
  }

  // 7〜8月: ひまわりを左下に1本だけ（控えめ・固定）
  if (kind === 'summer') {
    sunflowerEl = document.createElement('span');
    sunflowerEl.className = 'sparticle';
    sunflowerEl.textContent = '🌻';
    sunflowerEl.style.fontSize = '22px';
    sunflowerEl.style.left = '8px';
    sunflowerEl.style.bottom = '4px';
    sunflowerEl.style.opacity = '0.45';
    stage.appendChild(sunflowerEl);
  }
}

function seasonStep(now) {
  if (!seasonParticles.length) return;
  var H = window.innerHeight, W = window.innerWidth;
  var t = now / 1000;
  for (var i = 0; i < seasonParticles.length; i++) {
    var p = seasonParticles[i];
    if (p.kind === 'summer') {
      // その場で瞬く（opacityをゆっくり明滅、最大0.5）
      var tw = (Math.sin(t * 1.4 + p.phase) + 1) / 2;     // 0〜1
      p.el.style.opacity = (tw * 0.5).toFixed(2);
      if (tw < 0.02 && Math.random() < 0.02) {            // 消えた瞬間に時々場所替え
        p.x = rand(0, W); p.y = rand(0, H * 0.6);
      }
    } else {
      p.y += p.vy;
      var sx = (p.kind === 'rain') ? -p.vy * 0.25 : Math.sin(t * 0.8 + p.phase) * 0.4;
      p.x += sx;
      if (p.kind !== 'rain') {
        p.el.style.transform = 'rotate(' + (Math.sin(t * 0.7 + p.phase) * 40) + 'deg)';
        p.el.style.opacity = '0.42';
      } else {
        p.el.style.opacity = '1'; // rainDrop自体が rgba(...,0.42) なので実質0.42
      }
      if (p.y > H + 20) {         // 画面下に抜けたら上へ戻す
        p.y = rand(-60, -16);
        p.x = rand(0, W);
      }
    }
    p.el.style.left = p.x + 'px';
    p.el.style.top  = p.y + 'px';
  }
}

/* 月に応じた季節セリフを少量追加（労基トーンは維持） */
function addSeasonLines() {
  var m = new Date().getMonth() + 1;
  if (m === 6) {
    LINES.morning.push("雨の日は足元注意だにゃ☔");
    LINES.afternoon.push("雨上がりは滑りやすいにゃ、ご安全に☔");
    LINES_MEMBER.morning.push("雨の日は足元にご注意を☔");
  } else if (m === 1) {
    LINES.earlyMorning.push("あけましておめでとうにゃ🎍 今年もご安全に");
    LINES.morning.push("あけましておめでとうにゃ🎍");
    LINES_MEMBER.morning.push("あけましておめでとうございます🎍");
  } else if (m === 3 || m === 4) {
    LINES.afternoon.push("桜がきれいな季節だにゃ🌸 ひと息つこ");
  } else if (m === 7 || m === 8) {
    LINES.afternoon.push("暑い日は熱中症に注意だにゃ🌻 こまめに水分！");
    LINES_MEMBER.afternoon.push("熱中症対策、しっかりしましょう🌻");
  }
}

/* =========================================================================
   メインループ（毎フレーム描画）
   ========================================================================= */
function loop(now) {
  for (var i = 0; i < chars.length; i++) stepChar(chars[i], now);
  checkKakeai(now);
  seasonStep(now);    // v3.2: 季節パーティクル（タブ非表示時はrAFごと停止）
  requestAnimationFrame(loop);
}

/* =========================================================================
   なかまのランタイム生成（顔dataURL → 全身スプライト → DOM登録）
   ========================================================================= */
function createMemberRuntime(m, mode, index) {
  // mode: 'enter'（出勤演出あり） / 'place'（その場に配置） / 'hidden'
  var faceImg = new Image();
  faceImg.onload = function () {
    try {
      var isArt = (m.type === 'art');   // v3.3: art型＝完成イラストをそのまま全身に
      var el = document.createElement('img');
      el.className = 'member';
      el.src = isArt ? m.face : buildSprite(faceImg, m.color || MEMBER_COLORS[0]);
      el.alt = m.name;
      el.draggable = false;
      el.style.zIndex = String(2 + (chars.length % 4));  // 重なりを散らす
      el.style.display = 'none';
      stage.appendChild(el);

      var c = {
        id: m.id,
        isCat: false,
        member: m,
        el: el,
        bubbleEl: makeBubbleEl(),
        tagEl: makeTagEl(m.name),
        imgRatio: isArt ? (faceImg.naturalWidth / Math.max(1, faceImg.naturalHeight)) : (SPRITE_W / SPRITE_H),  // v3.3
        posX: 0, dir: 1,
        w: 100, h: 150,
        state: 'idle', stateEndAt: 0, animStart: 0,
        targetX: 0,
        visible: false,
        bubbleTimer: null, bubbleHideTimer: null
      };
      c.tagEl.style.display = 'none';
      el.addEventListener('click', function () { petChar(c); });  // v3.2: なでなで
      m._rt = c;
      chars.push(c);
      resizeChar(c);

      if (m.present && mode === 'enter')      spawnEnter(c);
      else if (m.present && mode === 'place') placeDirect(c, index || 1);
      /* present=false はそのまま非表示 */

      scheduleBubble(c, rand(4000, 9000));
      renderPanel();
      updateBadge();
    } catch (e) { /* 1人の生成失敗で全体を止めない */ }
  };
  faceImg.onerror = function () { /* 壊れた顔データは無視 */ };
  faceImg.src = m.face;
}

/* 色変更などでスプライトを作り直す */
function rebuildSprite(m) {
  if (!m._rt) return;
  if (m.type === 'art') return;  // v3.3: art型は完成イラストなので作り直し不要
  var faceImg = new Image();
  faceImg.onload = function () {
    try { m._rt.el.src = buildSprite(faceImg, m.color); } catch (e) {}
  };
  faceImg.src = m.face;
}

/* なかまを完全に削除 */
function removeMember(m) {
  var c = m._rt;
  if (c) {
    if (c.bubbleTimer) clearTimeout(c.bubbleTimer);
    if (c.bubbleHideTimer) clearTimeout(c.bubbleHideTimer);
    if (c.el.parentNode) c.el.parentNode.removeChild(c.el);
    if (c.bubbleEl.parentNode) c.bubbleEl.parentNode.removeChild(c.bubbleEl);
    if (c.tagEl.parentNode) c.tagEl.parentNode.removeChild(c.tagEl);
    var idx = chars.indexOf(c);
    if (idx > 0) chars.splice(idx, 1);
  }
  var mi = members.indexOf(m);
  if (mi >= 0) members.splice(mi, 1);
  saveMembers();
  renderPanel();
  updateBadge();
}

/* 出退勤の切替 */
function setPresent(m, present) {
  m.present = present;
  saveMembers();
  if (m._rt) {
    if (present) spawnEnter(m._rt);
    else         beginExit(m._rt);
  }
  renderPanel();
}

/* なかま一覧の描画 */

    var sw = document.createElement('label');

    var knob = document.createElement('span');

    var edit = document.createElement('button');
    edit.className = 'iconBtn';
    edit.textContent = '✏️';
    edit.title = '名前・色を変更';
    edit.addEventListener('click', function () { openEditor('edit', null, m); });

    var del = document.createElement('button');
    del.className = 'iconBtn';
    del.textContent = '🗑️';
    del.title = '削除';
    del.addEventListener('click', function () {
      // confirm代替（Notion埋め込みでは無効のため）: 3秒以内の2度押しで削除を確定
      if (del.dataset.armed === '1') { removeMember(m); return; }
      del.dataset.armed = '1';
      del.textContent = '本当に削除？';
      del.style.color = '#c0392b';
      del.style.fontWeight = '700';
      del.style.whiteSpace = 'nowrap';
      del.title = 'もう一度押すと削除します（3秒で元に戻ります）';
      setTimeout(function () {
        del.dataset.armed = '';
        del.textContent = '🗑️';
        del.style.color = '';
        del.style.fontWeight = '';
        del.title = '削除';
      }, 3000);
    });

    row.appendChild(th); row.appendChild(nm); row.appendChild(sw);
    row.appendChild(edit); row.appendChild(del);
    memberList.appendChild(row);
  });

  // 上限チェック
  if (members.length >= MEMBER_MAX) {
    addBtn.disabled = true;
    addBtn.textContent = 'なかまは最大' + MEMBER_MAX + '人までです';
  } else {
    addBtn.disabled = false;
    addBtn.textContent = '＋ なかまを追加';
  }
  syncCheckboxes();
}

addBtn.addEventListener('click', function () {
  if (members.length >= MEMBER_MAX) return;
  fileInput.value = '';
  fileInput.click();
});
fileInput.addEventListener('change', function () {
  if (fileInput.files && fileInput.files[0]) acceptImageFile(fileInput.files[0]);
});

/* ドラッグ&ドロップでも追加できる */
document.addEventListener('dragover', function (e) { e.preventDefault(); });
document.addEventListener('drop', function (e) {
  e.preventDefault();
  if (!editorModal.classList.contains('hidden')) return; // 編集中は無視
  var files = e.dataTransfer && e.dataTransfer.files;
  if (!files || !files.length) return;
  for (var i = 0; i < files.length; i++) {
    if (files[i].type && files[i].type.indexOf('image/') === 0) {
      acceptImageFile(files[i]);
      return;
    }
  }
});

function acceptImageFile(file) {
  if (members.length >= MEMBER_MAX) {
    showToast('なかまは最大' + MEMBER_MAX + '人までです。先に誰かを削除してください。');
    return;
  }
  if (!file.type || file.type.indexOf('image/') !== 0) {
    showToast('画像ファイルを指定してください。');
    return;
  }
  var fr = new FileReader();
  fr.onload = function () {
    var img = new Image();
    img.onload  = function () { openEditor('new', img, null); };
    img.onerror = function () { showToast('画像を読み込めませんでした。'); };
    img.src = fr.result;
  };
  fr.onerror = function () { showToast('ファイルを読み込めませんでした。'); };
  fr.readAsDataURL(file);
}

/* =========================================================================
   UI: なかま追加・編集モーダル（円形クロップ）
   ========================================================================= */
var editorModal = document.getElementById('editorModal');
var edTitle   = document.getElementById('edTitle');
var cropWrap  = document.getElementById('cropWrap');
var cropBox   = document.getElementById('cropBox');
var cropImg   = document.getElementById('cropImg');
var zoomRange = document.getElementById('zoom');
var nameInput = document.getElementById('nameInput');
var colorRow  = document.getElementById('colorRow');
var edOK      = document.getElementById('edOK');
var edCancel  = document.getElementById('edCancel');

var CROP_D = 220;               // クロップ円の直径（openEditor時にCSS実寸から再取得）
var edMode = 'new';             // 'new' | 'edit'
var edImg = null;               // 元画像（Image）
var edMember = null;            // 編集対象（editモード）
var edScale = 1, edMinScale = 1, edOffX = 0, edOffY = 0;
var edColor = MEMBER_COLORS[0];

/* --- v3.3: 登録モードタブ（イラスト/写真）の制御 --- */
var modeTabs   = document.getElementById('modeTabs');
var tabArt     = document.getElementById('tabArt');
var tabSticker = document.getElementById('tabSticker');
var artWrap    = document.getElementById('artWrap');
var artPreview = document.getElementById('artPreview');
var colorSec   = document.getElementById('colorSec');
var edTab = 'art';     // 'art' | 'sticker'（newモードのみ使用）
var edArt = null;      // 処理済みイラスト {url, removedBg}

function prepareArt() {
  try {
    edArt = processArtImage(edImg);
    artPreview.src = edArt.url;
    if (edArt.removedBg) {
      showToast('白背景を自動で透過しました。市松模様＝透過部分です。', 3500);
    }
  } catch (e) {
    edArt = null;
    artPreview.src = '';
    showToast('イラストの処理に失敗しました。別の画像（または透過PNG）でお試しください。');
  }
}

function setEdTab(tab) {
  edTab = tab;
  tabArt.classList.toggle('sel', tab === 'art');
  tabSticker.classList.toggle('sel', tab === 'sticker');
  artWrap.style.display  = (tab === 'art') ? '' : 'none';
  cropWrap.style.display = (tab === 'sticker') ? '' : 'none';
  colorSec.style.display = (tab === 'sticker') ? '' : 'none';
  if (tab === 'sticker' && edMode === 'new' && edImg) {
    // 表示直後に実寸を再確認（クロップ枠はCSSのmin()/vminで縮むため）
    var dNow = cropBox.clientWidth || 0;
    if (dNow && dNow !== CROP_D) {
      CROP_D = dNow;
      edMinScale = Math.max(CROP_D / edImg.naturalWidth, CROP_D / edImg.naturalHeight);
      edScale = edMinScale;
      zoomRange.value = 100;
      edOffX = (CROP_D - edImg.naturalWidth * edScale) / 2;
      edOffY = (CROP_D - edImg.naturalHeight * edScale) / 2;
      applyCropView();
    }
  }
  if (tab === 'art' && edImg && !edArt) prepareArt();
}
tabArt.addEventListener('click', function () { setEdTab('art'); });
tabSticker.addEventListener('click', function () { setEdTab('sticker'); });

/* 色見本の生成 */
function renderSwatches() {
  colorRow.innerHTML = '';
  MEMBER_COLORS.forEach(function (col) {
    var s = document.createElement('div');
    s.className = 'swatch' + (col === edColor ? ' sel' : '');
    s.style.background = col;
    s.title = col;
    s.addEventListener('click', function () {
      edColor = col;
      renderSwatches();
    });
    colorRow.appendChild(s);
  });
}

function clampOffsets() {
  var w = edImg.naturalWidth * edScale;
  var h = edImg.naturalHeight * edScale;
  if (edOffX > 0) edOffX = 0;
  if (edOffY > 0) edOffY = 0;
  if (edOffX < CROP_D - w) edOffX = CROP_D - w;
  if (edOffY < CROP_D - h) edOffY = CROP_D - h;
}
function applyCropView() {
  cropImg.style.width = (edImg.naturalWidth * edScale) + 'px';
  cropImg.style.left  = edOffX + 'px';
  cropImg.style.top   = edOffY + 'px';
}

function openEditor(mode, img, member) {
  edMode = mode;
  edMember = member || null;
  editorModal.classList.remove('hidden'); // 先に表示してクロップ枠の実寸を測れるようにする
  if (mode === 'new') {
    edTitle.textContent = 'なかまを追加';
    modeTabs.style.display = '';          // v3.3: タブ表示
    edArt = null;
    artPreview.src = '';
    cropWrap.style.display = '';          // 一旦表示してクロップ枠の実寸を測る
    CROP_D = cropBox.clientWidth || 220;  // 狭い枠ではCSSのmin()で縮むため実寸に追従
    edImg = img;
    edColor = MEMBER_COLORS[0];
    nameInput.value = '';
    edMinScale = Math.max(CROP_D / img.naturalWidth, CROP_D / img.naturalHeight);
    edScale = edMinScale;
    zoomRange.value = 100;
    // 中央寄せ
    edOffX = (CROP_D - img.naturalWidth * edScale) / 2;
    edOffY = (CROP_D - img.naturalHeight * edScale) / 2;
    cropImg.src = img.src;
    applyCropView();
    setEdTab('art');   // v3.3: 推奨＝イラスト登録タブを初期表示（背景透過処理もここで実行）
  } else {
    edTitle.textContent = 'なかまを編集';
    modeTabs.style.display = 'none';                                  // v3.3: 編集時はタブ非表示
    artWrap.style.display = 'none';
    colorSec.style.display = (member.type === 'art') ? 'none' : '';   // v3.3: art型に作業服色の概念なし
    cropWrap.style.display = 'none';  // 顔の取り直しは「削除→再追加」で
    edImg = null;
    edColor = member.color || MEMBER_COLORS[0];
    nameInput.value = member.name;
  }
  renderSwatches();
}
function closeEditor() {
  editorModal.classList.add('hidden');
  edImg = null;
  edMember = null;
  edArt = null;          // v3.3
  artPreview.src = '';   // v3.3
  cropImg.src = '';
}
edCancel.addEventListener('click', closeEditor);

/* クロップのドラッグ操作 */
var dragOn = false, dragSX = 0, dragSY = 0, dragOX = 0, dragOY = 0;
cropBox.addEventListener('pointerdown', function (e) {
  if (!edImg) return;
  dragOn = true;
  dragSX = e.clientX; dragSY = e.clientY;
  dragOX = edOffX;    dragOY = edOffY;
  try { cropBox.setPointerCapture(e.pointerId); } catch (err) { /* 未対応環境では無視（ドラッグ自体は動く） */ }
});
cropBox.addEventListener('pointermove', function (e) {
  if (!dragOn || !edImg) return;
  edOffX = dragOX + (e.clientX - dragSX);
  edOffY = dragOY + (e.clientY - dragSY);
  clampOffsets();
  applyCropView();
});
cropBox.addEventListener('pointerup',     function () { dragOn = false; });
cropBox.addEventListener('pointercancel', function () { dragOn = false; });

/* ズーム（スライダー＋ホイール）。中心を保ったまま拡縮 */
function setZoom(newScale) {
  if (!edImg) return;
  if (newScale < edMinScale) newScale = edMinScale;
  var cx = (CROP_D / 2 - edOffX) / edScale;  // いま中心に見えている元画像座標
  var cy = (CROP_D / 2 - edOffY) / edScale;
  edScale = newScale;
  edOffX = CROP_D / 2 - cx * edScale;
  edOffY = CROP_D / 2 - cy * edScale;
  clampOffsets();
  applyCropView();
}
zoomRange.addEventListener('input', function () {
  setZoom(edMinScale * (Number(zoomRange.value) / 100));
});
cropBox.addEventListener('wheel', function (e) {
  e.preventDefault();
  var v = Number(zoomRange.value) + (e.deltaY < 0 ? 12 : -12);
  if (v < 100) v = 100;
  if (v > 320) v = 320;
  zoomRange.value = v;
  setZoom(edMinScale * (v / 100));
}, { passive: false });

/* OK（確定） */
edOK.addEventListener('click', function () {
  var name = nameInput.value.replace(/\s+$/, '').replace(/^\s+/, '').slice(0, 8);
  if (!name) { showToast('なまえを入力してください。'); return; }

  if (edMode === 'new') {
    if (!edImg) { closeEditor(); return; }
    var m;
    if (edTab === 'art') {
      // v3.3: イラスト登録（処理済みの完成イラストをそのまま全身キャラに）
      if (!edArt || !edArt.url) {
        showToast('イラストを処理できませんでした。別の画像（または透過PNG）でお試しください。');
        return;
      }
      m = {
        id: Date.now() + '_' + Math.floor(Math.random() * 10000),
        name: name,
        color: edColor,
        face: edArt.url,
        type: 'art',
        present: true
      };
    } else {
      // 従来: クロップ円 → 元画像の正方形領域 → 顔ステッカー＋ちびキャラ体
      var sx = -edOffX / edScale;
      var sy = -edOffY / edScale;
      var sw = CROP_D / edScale;
      var face = faceToDataURL(edImg, sx, sy, sw);
      m = {
        id: Date.now() + '_' + Math.floor(Math.random() * 10000),
        name: name,
        color: edColor,
        face: face,
        type: 'sticker',
        present: true
      };
    }
    members.push(m);
    if (!saveMembers()) {        // 容量超過 → 取り消し
      members.pop();
      return;
    }
    createMemberRuntime(m, 'enter', members.length);
  } else if (edMember) {
    var colorChanged = (edMember.color !== edColor);
    edMember.name = name;
    edMember.color = edColor;
    saveMembers();
    if (edMember._rt) {
      edMember._rt.tagEl.textContent = name;
      edMember._rt.el.alt = name;
      if (colorChanged) rebuildSprite(edMember);
    }
  }
  renderPanel();
  closeEditor();
});

/* =========================================================================
   UI: エクスポート / インポート（端末をまたぐ引き継ぎ用）
   ========================================================================= */
document.getElementById('exportBtn').addEventListener('click', function () {
  try {
    var data = {
      app: 'zeronyan-widget',
      version: 3,
      exportedAt: new Date().toISOString(),
      settings: settings,
      members: members.map(function (m) {
        return { id: m.id, name: m.name, color: m.color, face: m.face, type: (m.type === 'art' ? 'art' : 'sticker'), present: m.present };
      })
    };
    var blob = new Blob([JSON.stringify(data)], { type: 'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    var d = new Date();
    a.download = 'zeronyan_nakama_' + d.getFullYear() +
      ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2) + '.json';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
  } catch (e) {
    showToast('書き出しに失敗しました。Notion埋め込み内ではダウンロードが制限される場合があります。ブラウザで直接開いてお試しください。', 6000);
  }
});

var importBtn = document.getElementById('importBtn');
var importArmTimer = null;
function resetImportBtn() {
  if (importArmTimer) { clearTimeout(importArmTimer); importArmTimer = null; }
  importBtn.dataset.armed = '';
  importBtn.textContent = '読み込み';
  importBtn.style.color = '';
  importBtn.style.borderColor = '';
  importBtn.style.fontWeight = '';
}
importBtn.addEventListener('click', function () {
  // confirm代替（Notion埋め込みでは無効のため）:
  // 既存のなかまがいる場合は上書きになるので、3秒以内の2度押しで確認する
  if (members.length && importBtn.dataset.armed !== '1') {
    importBtn.dataset.armed = '1';
    importBtn.textContent = '上書きします。もう一度';
    importBtn.style.color = '#c0392b';
    importBtn.style.borderColor = '#c0392b';
    importBtn.style.fontWeight = '700';
    importArmTimer = setTimeout(resetImportBtn, 3000);
    return;
  }
  resetImportBtn();
  importInput.value = '';
  importInput.click();
});
importInput.addEventListener('change', function () {
  var file = importInput.files && importInput.files[0];
  if (!file) return;
  if (file.size > 8 * 1024 * 1024) {
    showToast('ファイルが大きすぎます（8MB超）。読み込みを中止しました。');
    return;
  }
  var fr = new FileReader();
  fr.onload = function () {
    try {
      var data = JSON.parse(fr.result);
      if (!data || data.app !== 'zeronyan-widget' ||
          Object.prototype.toString.call(data.members) !== '[object Array]') {
        showToast('なかまデータのファイルではないようです。');
        return;
      }
      // 上書きの確認は「読み込み」ボタンの2度押しで実施済み

      // 既存メンバーを全削除
      members.slice().forEach(function (m) { removeMember(m); });

      var incoming = data.members.filter(function (x) {
        return x && typeof x.name === 'string' && typeof x.face === 'string' &&
               x.face.indexOf('data:image/') === 0;
      }).slice(0, MEMBER_MAX);

      incoming.forEach(function (x, i) {
        var m = {
          id: x.id || (Date.now() + '_' + i),
          name: String(x.name).slice(0, 8),
          color: (MEMBER_COLORS.indexOf(x.color) >= 0) ? x.color : MEMBER_COLORS[0],
          face: x.face,
          type: (x.type === 'art') ? 'art' : 'sticker',   // v3.3: typeなし＝従来のsticker扱い
          present: !!x.present
        };
        members.push(m);
        createMemberRuntime(m, 'place', i + 1);
      });
      if (data.settings) {
        if (typeof data.settings.nametag === 'boolean') settings.nametag = data.settings.nametag;
        if (typeof data.settings.badge   === 'boolean') settings.badge   = data.settings.badge;
        if (typeof data.settings.season  === 'boolean') settings.season  = data.settings.season;
        saveSettings();
        seasonInit();
      }
      saveMembers();
      renderPanel();
      updateBadge();
    } catch (e) {
      showToast('読み込みに失敗しました。ファイルが壊れている可能性があります。');
    }
  };
  fr.readAsText(file);
});

/* =========================================================================
   起動
   ========================================================================= */
function start() {
  loadAll();

  // ぜろにゃん本体を chars[0] として登録
  var catChar = {
    id: 'zeronyan',
    isCat: true,
    el: cat,
    bubbleEl: document.getElementById('bubble'),
    tagEl: makeTagEl('ぜろにゃん'),
    imgRatio: 401 / 528,       // 元画像の縦横比（幅/高さ）v3.2でしっぽ完全版に差し替え
    posX: window.innerWidth * 0.4,
    dir: 1,
    w: 200, h: 300,
    state: 'idle', stateEndAt: 0, animStart: 0,
    targetX: 0,
    visible: true,
    bubbleTimer: null, bubbleHideTimer: null
  };
  chars.push(catChar);
  cat.draggable = false;
  cat.addEventListener('click', function () { petChar(catChar); });  // v3.2: なでなで
  resize();
  applyMood();
  addSeasonLines();   // v3.2: 月に応じた季節セリフを追加
  seasonInit();       // v3.2: 季節の背景演出を開始

  // 保存済みのなかまを復元（出勤者はその場に配置）
  members.forEach(function (m, i) {
    createMemberRuntime(m, 'place', i + 1);
  });

  // v3.4: ぜろにゃん検定（日付が変わったら「きょうの1問」を解禁）
  loadQuiz();
  quizCheckDay();
  updateQuizMark();
  setInterval(function () { quizCheckDay(); updateQuizMark(); }, 60000);  // 開きっぱなしでも日替わりに追従

  requestAnimationFrame(loop);
  scheduleBubble(catChar, 1800);     // 最初の吹き出し
  setInterval(applyMood, 30000);     // 30秒ごとに気分（明るさ）を再判定
  lastKakeai = performance.now();    // 起動直後の掛け合いを抑止

  updateBadge();
  if (!storageOK) {
    var note = document.getElementById('storageNote');
    note.textContent = '※この環境では保存（localStorage）が使えません。なかまは表示中のみ有効で、ぜろにゃん検定も利用できません。';
  }
}

if (cat.complete) start();
else cat.addEventListener('load', start);
</script>
